[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowball-autocallable"
version = "0.1.0"
description = "Discrete-barrier Snowball pricing and hedging under Black-Scholes"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<4",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
notebook = ["ipykernel>=6,<8", "nbclient>=0.10,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
